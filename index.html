<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Calc</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="top">
    <button id="avatarBtn" class="avatar" aria-label="Settings"><img id="avatarImg" alt=""><span id="avatarLetter"></span></button>
    <div id="greet"></div>
    <div class="topbtns">
      <button id="btnUndo" class="icon" aria-label="Undo"></button>
      <button id="btnHistory" class="icon" aria-label="History"></button>
      <button id="btnTools" class="icon" aria-label="Tools"></button>
      <button id="btnSettings" class="icon" aria-label="Settings"></button>
    </div>
  </header>

  <section id="display">
    <div id="exprWrap"><div id="expr"></div></div>
    <div id="resultLine">
      <span id="memFlag">M</span>
      <span id="result"></span>
    </div>
    <div id="altLine"></div>
    <div class="disp-actions">
      <button id="btnCopy" class="mini">Copy</button>
      <button id="btnPaste" class="mini">Paste</button>
    </div>
  </section>

  <section id="keys">
    <div id="utilRow"></div>
    <div id="pads">
      <div id="sci" class="pad"></div>
      <div id="basic" class="pad"></div>
    </div>
  </section>
</div>

<div id="toast"></div>
<div id="sheetRoot"></div>

<script src="config.js"></script>
<script src="engine.js"></script>
<script src="tools.js"></script>
<script src="app.js"></script>
</body>
</html>
